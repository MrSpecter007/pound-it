{% load wagtailcore_tags %}
<section class="pi-section {% if dark %}pi-dark{% endif %}"><div class="pi-container pi-split {% if reverse %}pi-split--reverse{% endif %}"><div class="pi-editorial-media">{% include 'poundit/components/image.html' with image=image fallback=fallback alt=alt ratio='landscape' only %}</div><div><p class="pi-eyebrow">{{ eyebrow }}</p><h2>{{ title }}</h2><div class="pi-prose">{{ body|richtext }}</div>{% if url %}<a class="pi-text-link" href="{{ url }}">{{ link_text|default:'Discover more' }} <span aria-hidden="true">↗</span></a>{% endif %}</div></div></section>
