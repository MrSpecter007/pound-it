{% load wagtailcore_tags %}
<section class="py-4 nous-joindre">
  <div class="container">

    {% if self.title %}
      <h3 class="mb-4 text-center">{{ self.title }}</h3>
    {% endif %}

    <div class="row g-4">

      {% if self.col1 %}
      <div class="col-md-4">
        <div class="contact-card h-100 p-4 shadow-sm">
          {{ self.col1|richtext }}
        </div>
      </div>
      {% endif %}

      {% if self.col2 %}
      <div class="col-md-4">
        <div class="contact-card h-100 p-4 shadow-sm">
          {{ self.col2|richtext }}
        </div>
      </div>
      {% endif %}

      {% if self.col3 %}
      <div class="col-md-4">
        <div class="contact-card h-100 p-4 shadow-sm">
          {{ self.col3|richtext }}
        </div>
      </div>
      {% endif %}

    </div>

  </div>
</section>
