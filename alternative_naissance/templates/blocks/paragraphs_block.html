{% load wagtailimages_tags wagtailcore_tags %}

<section class="paragraphs-section py-5">
    <div class="container">
        {% for paragraph in value.paragraphs %}
            <div class="row mb-4">
                <div class="col-xl-12">
                    <p class="paragraph-text">
                        {{ paragraph|richtext }}
                    </p>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
