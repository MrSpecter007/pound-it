{% load wagtailimages_tags %}

<section class="testimonial-one">
    <div class="testimonial-one-shape-2 float-bob-y">
        <img src="/static/images/shapes/testimonial-one-shape-2.png" alt="">
    </div>
    <div class="testimonial-one-shape-3 float-bob-y">
        <img src="/static/images/shapes/testimonial-one-shape-3.png" alt="">
    </div>
    <div class="container">
        <div class="testimonial-one__top">
            <div class="row">
                <div class="col-xl-12">
                    <div class="testimonial-one__top-left">
                        <div class="section-title text-left">
                            <div class="section-sub-title-box">
                                <p class="section-sub-title">Témoignages</p>
                                <div class="section-title-shape-1">
                                    <img src="/static/images/shapes/section-title-shape-1.png" alt="">
                                </div>
                                <div class="section-title-shape-2">
                                    <img src="/static/images/shapes/section-title-shape-2.png" alt="">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <div class="testimonial-one__bottom">
            <div class="row">
                <div class="col-xl-12">
                    <div class="owl-carousel owl-theme thm-owl__carousel testimonial-one__carousel"
                         data-owl-options='{
                            "loop": true,
                            "autoplay": true,
                            "margin": 30,
                            "nav": false,
                            "dots": false,
                            "smartSpeed": 500,
                            "autoplayTimeout": 10000,
                            "navText": ["<span class=\"fa fa-angle-left\"></span>","<span class=\"fa fa-angle-right\"></span>"],
                            "responsive": {
                                "0": {"items": 1},
                                "768": {"items": 2},
                                "992": {"items": 2},
                                "1200": {"items": 2}
                            }
                         }'>
                            {% for testimonial in testimonials  %}
                                <div class="item">
                          
                                    <div class="testimonial-one__single">
                                        <div class="testimonial-one__single-inner">

                                            <div class="testimonial-one__client-info">
                                                <div class="">
                                                    {% load static %}
                                                    <div class="testimonial-icon
                                                        {% if forloop.counter|divisibleby:3 %}
                                                            icon-blue
                                                        {% elif forloop.counter|divisibleby:2 %}
                                                            icon-purple
                                                        {% else %}
                                                            icon-pink
                                                        {% endif %}">
    
                                                        <svg viewBox="0 0 120 120" class="icon-svg">
                                                            <circle cx="60" cy="60" r="58"
                                                                    fill="currentColor"
                                                                    opacity="0.15"
                                                                    stroke="currentColor"
                                                                    stroke-width="2"/>

                                                            <path d="M60 68a20 20 0 1 0-20-20 20 20 0 0 0 20 20z"
                                                                    fill="currentColor"/>

                                                            <path d="M25 95c0-10 12-20 35-20s35 10 35 20v5H25z"
                                                                    fill="currentColor"/>

                                                            <path d="M60 68a18 18 0 1 0-18-18 18 18 0 0 0 18 18z"
                                                                    fill="white"
                                                                    opacity="0.25"/>

                                                            <path d="M28 96h64a2 2 0 0 1 2 2v1H26v-1a2 2 0 0 1 2-2z"
                                                                    fill="currentColor"
                                                                    opacity="0.4"/>
                                                        </svg>

                                                    </div>                                         
                                                </div>                               
                                            </div>

                                            <p class="testimonial-one__text"><i>" {{ testimonial.client_text }} "</i></p>

                                            {% if testimonial.client_name %}
                                            <p><strong>{{ testimonial.client_name }}</strong></p>
                                            {% endif %}

                                            <p class="testimonial-one__text"><b>{{ testimonial.get_category_display  }}</b></p>
                                        </div>
                                    </div>

                                </div>
                                
                            {% endfor %}

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
