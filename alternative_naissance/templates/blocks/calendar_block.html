{% load wagtailcore_tags %}

<section class="calendar-section py-5">
  <div class="container">
    {% if self.title %}
      <div class="section-title text-center mb-4">
        <h2 class="title">{{ self.title }}</h2>
      </div>
    {% endif %}

    {% if events %}
      <div id="calendar-container-{{ calendar_id }}" class="calendar-container shadow p-3 bg-white rounded"></div>

      {# On injecte les events au format JSON dans un script caché #}
      {{ events|json_script:calendar_id }}
    {% else %}
      <p class="text-center text-muted">Aucun événement prévu dans les 3 prochains mois.</p>
    {% endif %}
  </div>
</section>

{# FullCalendar CSS + JS #}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var dataEl = document.getElementById('{{ calendar_id }}');
  var containerEl = document.getElementById('calendar-container-{{ calendar_id }}');

  if (!dataEl || !containerEl) return;

  var events = [];
  try {
    if (dataEl.textContent.trim() !== "") {
      events = JSON.parse(dataEl.textContent);
    }
  } catch (err) {
    console.error("Erreur lors du parsing des événements:", err);
  }

  var calendar = new FullCalendar.Calendar(containerEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,listMonth'
    },
    locale: 'fr',
    events: events,
    buttonText: {
      today: "Aujourd'hui",
      month: "Mois",
      list: "Liste"
    }
  });

  calendar.render();
});
</script>
