{% extends "base.html" %}

{% block content %}

<section class="py-5">
<div class="container">

<h1>Laisser un témoignage</h1>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label>Votre témoignage</label>
        <textarea name="client_text" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
        <label>Catégorie</label>
        <select name="category" class="form-control" required>

            {% for value, label in categories %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}

        </select>
    </div>

    <button type="submit" class="btn btn-primary">
        Envoyer le témoignage
    </button>

</form>

</div>
</section>

{% endblock %}
