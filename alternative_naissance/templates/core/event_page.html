{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block content %}
<section class="event-detail py-5">
  <div class="container">
    <h1 class="mb-3">{{ page.title }}</h1>

    <p><strong>Date :</strong> {{ page.date }}</p>

    {% if page.description %}
      <div class="event-description">
        {{ page.description|richtext }}
      </div>
    {% endif %}

    {% if page.link %}
      <p class="mt-3">
        <a href="{{ page.link }}" class="btn btn-primary" target="_blank">
          En savoir plus
        </a>
      </p>
    {% endif %}
  </div>
</section>
{% endblock %}
