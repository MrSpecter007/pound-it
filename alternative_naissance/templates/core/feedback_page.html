{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<section class="py-5">
  <div class="container">

    <h1>{{ page.title }}</h1>

    {% if request.GET.success %}
      <div class="alert alert-success">
        Merci pour votre retour 💛
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <input type="text" name="name" placeholder="Nom" class="form-control mb-2">
      <input type="email" name="email" placeholder="Courriel" class="form-control mb-2">

      <select name="type" class="form-control mb-2">
        <option value="">-- Choisir un type --</option>

        {% for value, label in types %}
            <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>

      <select name="category" class="form-control mb-2">
        <option value="">-- Choisir une catégorie --</option>

        {% for value, label in categories %}
            <option value="{{ value }}" {% if value == "naissance" %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>

      <textarea name="message" class="form-control mb-3"></textarea>

      <button type="submit" class="btn btn-primary">
        Envoyer
      </button>
    </form>

  </div>
</section>

{% endblock %}
