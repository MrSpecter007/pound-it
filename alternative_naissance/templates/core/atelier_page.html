{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="py-5">
  <div class="container">
    <h1>{{ page.title }}</h1>
    <p>{{ page.date }} — {{ page.location }}</p>
    <div>{{ page.description|richtext }}</div>
    {% if page.lien %}
      <a href="{{ page.lien }}" class="btn btn-primary mt-3">S'inscrire</a>
    {% endif %}
  </div>
</section>
{% endblock %}
