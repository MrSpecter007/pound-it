<li class="w-h-full">
  <div class="w-bg-surface-menus w-rounded-md w-p-4 w-text-text-context">
    <h3 class="w-label-3">Pound It: needs a person</h3>
    <ul>
      {% for item in outstanding %}
        <li>
          <strong>{{ item.count }}</strong> {{ item.label }}{% if item.urgent %} &mdash; worth doing now{% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>
</li>
