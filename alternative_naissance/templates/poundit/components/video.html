{% if video.file_url %}<figure class="pi-video"><video controls preload="none" {% if video.poster_url %}poster="{{ video.poster_url }}"{% endif %} aria-label="{{ video.title }}"><source src="{{ video.file_url }}" type="{{ video.mime_type|default:'video/mp4' }}">{% if video.captions_url %}<track kind="captions" src="{{ video.captions_url }}" srclang="en" label="English" default>{% endif %}</video><figcaption>{{ video.title }}{% if video.transcript_url %} · <a href="{{ video.transcript_url }}">Read transcript</a>{% endif %}</figcaption></figure>{% elif video.url %}<a class="pi-button" href="{{ video.url }}">{{ video.title|default:'Watch the video' }} <span aria-hidden="true">↗</span></a>{% endif %}
