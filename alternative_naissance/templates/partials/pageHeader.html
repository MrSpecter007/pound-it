{% load wagtailimages_tags %}

<section class="page-header">
    <div class="page-header-bg"
         {% if header_background %}
            {% image header_background original as bg %}
            style="background-image: url('{{ bg.url }}')"
         {% else %}
            style="background-image: url('/static/images/backgrounds/page-header-bg.jpg')"
         {% endif %}>
    </div>

    <div class="page-header-shape-1">
        <img src="/static/images/shapes/page-header-shape-1.png" alt="">
    </div>

    <div class="container">
        <div class="page-header__inner">
            <ul class="thm-breadcrumb list-unstyled">
                <li><a href="/">Home</a></li>
                <li><span>/</span></li>
                <li>{{ header_title }}</li>
            </ul>
            <h2>{{ header_subtitle }}</h2>
        </div>
    </div>
</section>
